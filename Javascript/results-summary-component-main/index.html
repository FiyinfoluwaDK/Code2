<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <main>
    <section class="result">

  <h1>Your Result</h1>

  <div class="score">
    <p class="score-number">76</p>
    <p class="score-total">of 100</p>
  </div>

  <h2>Great</h2>

  <p class="description">
    You scored higher than 65% of the people who have taken these tests.
  </p>

</section>
    <section class="summary">
  <h2>Summary</h2>
<ul>
  <li class="reaction">
    <span>Reaction</span>
    <span class="category-score">80 / 100</span>
  </li>

  <li class="memory">
    <span>Memory</span>
    <span class="category-score">92 / 100</span>
  </li>

  <li class="verbal">
    <span>Verbal</span>
    <span class="category-score">61 / 100</span>
  </li>

  <li class="visual">
    <span>Visual</span>
    <span class="category-score">72 / 100</span>
  </li>
</ul>
  <button type="button">Continue</button>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
